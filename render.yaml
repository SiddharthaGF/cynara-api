previews:
  generation: automatic
  expireAfterDays: 7

services:
  - type: web
    name: cynara-api
    runtime: docker
    plan: standard
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_HTTP_PORTS
        value: "10000"
      # Shared secrets (OpenAI, etc.) live in the cynara-shared environment
      # group managed in the Render dashboard. They are copied verbatim
      # into PR preview instances but must NOT be overridden here, because
      # Render does not accept inline previewValue on fromGroup entries.
      - fromGroup: cynara-shared
      # PR preview database connection. The workflow in
      # .github/workflows/preview-database.yml writes the per-PR Neon
      # branch string into the cynara-preview-db environment group before
      # Render starts the preview service. The application reads it via
      # ConnectionStrings:ActiveName (set below) and skips
      # EnsureCreatedAsync because Neon branches inherit the schema.
      - key: ConnectionStrings__ActiveName
        value: Prod
        previewValue: Preview
      - key: Database__PreviewStorage
        value: "false"
        previewValue: "true"
      # CORS is wide open on previews because Render assigns a unique
      # onrender.com subdomain per PR. The production service keeps the
      # origin allow-list from appsettings.json.
      - key: Cors__AllowedOrigins__0
        value: https://cynara.example.com
        previewValue: "*"
