name: Neon preview database

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: neon-pr-${{ github.event.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

permissions:
  contents: read
  pull-requests: write

env:
  NEON_BRANCH_NAME: unset

jobs:
  upsert:
    name: Create or update Neon branch for PR
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    steps:
      - name: Compute Neon branch name
        id: name
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          source_ref="${HEAD_REF:-${GITHUB_REF_NAME}}"
          sanitised="$(printf '%s' "${source_ref}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr '/_' '-' \
            | cut -c1-40)"
          name="${sanitised}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "Computed Neon branch name: ${name}"

      - name: Create Neon branch
        id: create
        uses: neondatabase/create-branch-action@v5
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch_name: ${{ steps.name.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Wait for Render preview service
        id: preview
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_BASE: cynara-api
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          base="https://api.render.com/v1"
          auth_header="Authorization: Bearer ${RENDER_API_KEY}"
          preview_name="${RENDER_SERVICE_BASE}"

          deadline=$(( $(date +%s) + 900 ))
          service_id=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            response=$(curl -sS -G -w "\n%{http_code}" \
              -H "$auth_header" \
              -H "Accept: application/json" \
              --data-urlencode "name=${preview_name}" \
              --data "limit=20" \
              --data "includePreviews=true" \
              "${base}/services")
            code=$(printf '%s' "$response" | tail -n1)
            body=$(printf '%s' "$response" | sed '$d')
            if [ "$code" != "200" ]; then
              echo "Render API returned ${code}, retrying in 10s..."
              sleep 10
              continue
            fi
            service_id=$(printf '%s' "$body" \
              | jq -r --arg n "${preview_name}" \
                  '.[] | select(.service.name == $n) | .service.id' \
              | head -n1)
            if [ -n "$service_id" ] && [ "$service_id" != "null" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$service_id" ] || [ "$service_id" = "null" ]; then
            echo "::error::Could not find Render preview service '${preview_name}' after 15 minutes."
            echo "::error::If previews are configured correctly in render.yaml and the PR is open against a linked branch, this usually means the service is still being provisioned."
            exit 1
          fi

          echo "service_id=${service_id}" >> "$GITHUB_OUTPUT"

      - name: Write Neon connection string into Render preview
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ steps.preview.outputs.service_id }}
          DB_URL: ${{ steps.create.outputs.db_url_with_pooler }}
        run: |
          set -euo pipefail
          base="https://api.render.com/v1"
          auth_header="Authorization: Bearer ${RENDER_API_KEY}"

          curl -fsS -X PUT \
            -H "$auth_header" \
            -H "Content-Type: application/json" \
            --data "$(jq -n --arg v "${DB_URL}" '{value: $v}')" \
            "${base}/services/${RENDER_SERVICE_ID}/env-vars/ConnectionStrings__Preview"

      - name: Trigger deploy of Render preview
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ steps.preview.outputs.service_id }}
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"

      - name: Comment on PR with Neon branch details
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: neon-preview
          message: |
            Neon branch `${{ env.NEON_BRANCH_NAME }}` ready.

            - Pooled connection string written into Render preview instance.
            - Schema inherited from the parent branch; no migrations run.
            - If the preview fails to boot, check the deploy logs in Render.

  delete:
    name: Delete Neon branch for PR
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Compute Neon branch name
        id: name
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          source_ref="${HEAD_REF:-${GITHUB_REF_NAME:-pr-${PR_NUMBER}}}"
          sanitised="$(printf '%s' "${source_ref}" \
            | tr '[:upper:]' '[:lower:]' \
            | tr '/_' '-' \
            | cut -c1-40)"
          name="pr-${PR_NUMBER}-${sanitised}"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
          echo "Computed Neon branch name: ${name}"

      - name: Delete Neon branch
        uses: neondatabase/delete-branch-action@v3
        with:
          project_id: ${{ vars.NEON_PROJECT_ID }}
          branch: ${{ steps.name.outputs.name }}
          api_key: ${{ secrets.NEON_API_KEY }}

      - name: Delete sticky PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: neon-preview
          delete: true
