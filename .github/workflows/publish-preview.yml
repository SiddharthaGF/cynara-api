name: Publish preview (develop)

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: preview-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: dotnet restore Cynara.Api.sln

      - name: Build
        run: >
          dotnet build Cynara.Api.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test Cynara.Api.sln
          --configuration Release
          --no-build
          --verbosity normal

      - name: Publish
        run: >
          dotnet publish src/Cynara.Api/Cynara.Api.csproj
          --configuration Release
          --output ./publish
          --runtime win-x86
          --self-contained false

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: cynara-api-preview
          path: ./publish/**
          if-no-files-found: error
          retention-days: 7

      - name: Deploy preview to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.PREVIEW_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.PREVIEW_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.PREVIEW_SERVER_USERNAME }}
          server-password: ${{ secrets.PREVIEW_SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'
