name: Deploy preview

on:
  push:
    branches: [develop]

concurrency:
  group: preview-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for CI to pass on this commit
        shell: bash
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          SHA="${{ github.sha }}"
          echo "Waiting for CI run on ${REPO} @ ${SHA} before deploying..."
          for attempt in $(seq 1 60); do
            CONCLUSION=$(curl -fsS \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/commits/${SHA}/check-runs" \
              | python -c "import sys, json
          data = json.load(sys.stdin)
          ci = [r for r in data.get('check_runs', []) if r.get('name') == 'Format, lint, and test']
          if not ci:
              print('pending')
          else:
              print(ci[0].get('conclusion') or ci[0].get('status') or 'pending')")
            echo "[${attempt}] CI status: ${CONCLUSION}"
            case "${CONCLUSION}" in
              success)
                exit 0
                ;;
              failure|cancelled|timed_out|action_required|startup_failure|stale)
                echo "##[error]CI conclusion is '${CONCLUSION}'; aborting deploy." >&2
                exit 1
                ;;
              *)
                sleep 10
                ;;
            esac
          done
          echo "##[error]Timed out waiting for CI to settle for ${SHA}" >&2
          exit 1

      - name: Setup .NET and restore
        uses: ./.github/actions/setup-dotnet-and-restore

      - name: Publish
        run: dotnet publish src/Cynara.Api/Cynara.Api.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cynara-api-preview
          path: ./publish/**
          if-no-files-found: error
          retention-days: 7

      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.PREVIEW_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.PREVIEW_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.PREVIEW_SERVER_USERNAME }}
          server-password: ${{ secrets.PREVIEW_SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'
