name: Deploy preview

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: preview-develop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    uses: ./.github/workflows/deploy-monsterasp-reusable.yml
    with:
      website-name: ${{ secrets.PREVIEW_WEBSITE_NAME }}
      server-computer-name: ${{ secrets.PREVIEW_SERVER_COMPUTER_NAME }}
      server-username: ${{ secrets.PREVIEW_SERVER_USERNAME }}
      server-password: ${{ secrets.PREVIEW_SERVER_PASSWORD }}
      upload-artifact: true
      artifact-name: cynara-api-preview
