name: Update development from main

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sync-main-develop
  cancel-in-progress: true

jobs:
  open_sync_pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect divergence
        id: diverge
        run: |
          git fetch origin main develop || true
          if git rev-parse --verify origin/develop >/dev/null 2>&1; then
            AHEAD=$(git rev-list --count origin/develop..origin/main)
            BEHIND=$(git rev-list --count origin/main..origin/develop)
          else
            echo "Branch 'develop' does not exist yet on origin."
            MAIN_COUNT=$(git rev-list --count origin/main)
            if [ "$MAIN_COUNT" -gt 0 ]; then
              AHEAD=1
            else
              AHEAD=0
            fi
            BEHIND=0
          fi
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "behind=$BEHIND" >> "$GITHUB_OUTPUT"
          if [ "$AHEAD" -gt 0 ]; then
            echo "diverged=true" >> "$GITHUB_OUTPUT"
          else
            echo "diverged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update sync PR
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = 'main';
            const base = 'develop';
            const title = 'chore(sync): main → develop';
            const head = `${owner}:${branch}`;
            const body = [
              'Automated sync PR opened because `main` is ahead of `develop`.',
              '',
              '- Source: `main`',
              '- Target: `develop`',
              '- Triggered by: push to `main`',
              '',
              'Please review and merge (or rebase) before any release work on `develop` diverges further.',
            ].join('\n');

            const existing = await github.rest.pulls.list({
              owner, repo, state: 'open', head, base,
            });

            // Ensure the base branch exists; create it from main if missing.
            try {
              await github.rest.repos.getBranch({ owner, repo, branch: base });
            } catch (err) {
              if (err.status === 404) {
                core.info(`Branch \`${base}\` does not exist. Creating it from \`${branch}\`.`);
                const mainSha = (
                  await github.rest.repos.getBranch({ owner, repo, branch })
                ).data.commit.sha;
                await github.rest.git.createRef({
                  owner, repo,
                  ref: `refs/heads/${base}`,
                  sha: mainSha,
                });
                // After creating develop from main there is nothing to sync yet.
                core.info(`Branch \`${base}\` created at the same SHA as \`${branch}\`. No sync PR needed.`);
                return;
              }
              throw err;
            }

            if (existing.data.length > 0) {
              core.info(`Sync PR already open: #${existing.data[0].number}. Updating branch.`);
              await github.rest.pulls.updateBranch({
                owner, repo,
                pull_number: existing.data[0].number,
              });
            } else {
              await github.rest.pulls.create({
                owner, repo, title, head, base, body,
                maintainer_can_modify: true,
              });
              core.info('Sync PR opened.');
            }
