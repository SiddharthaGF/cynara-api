name: _Deploy MonsterASP (reusable)

on:
  workflow_call:
    inputs:
      website-name:
        description: IIS website name on the target server.
        type: string
        required: true
      server-computer-name:
        description: Target server computer name.
        type: string
        required: true
      server-username:
        description: Username with Web Deploy rights on the target server.
        type: string
        required: true
      server-password:
        description: Password for the Web Deploy user.
        type: string
        required: true
      upload-artifact:
        description: Whether to upload a build artifact before deploying.
        type: boolean
        required: false
        default: false
      artifact-name:
        description: Artifact name when upload-artifact is true.
        type: string
        required: false
        default: "cynara-api-build"

jobs:
  deploy:
    name: Build and deploy
    runs-on: windows-latest
    steps:
      - name: Setup .NET and restore
        uses: ./.github/actions/setup-dotnet-and-restore

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/Cynara.Api/Cynara.Api.csproj
            --configuration Release
            --output ./publish
            --runtime win-x86
            --self-contained false

      - name: Upload artifact
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ./publish/**
          if-no-files-found: error
          retention-days: 7

      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ inputs.website-name }}
          server-computer-name: ${{ inputs.server-computer-name }}
          server-username: ${{ inputs.server-username }}
          server-password: ${{ inputs.server-password }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'
