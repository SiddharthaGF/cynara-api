name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-monsterasp-main
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Install dependencies
        run: dotnet restore Cynara.Api.sln

      - name: Build
        run: >
          dotnet build Cynara.Api.sln
          --configuration Release
          --no-restore

      - name: Test
        run: >
          dotnet test Cynara.Api.sln
          --configuration Release
          --no-build
          --verbosity normal

      - name: Publish
        run: >
          dotnet publish src/Cynara.Api/Cynara.Api.csproj
          --configuration Release
          --output ./publish
          --runtime win-x86
          --self-contained false

      - name: Deploy to MonsterASP.NET via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'
