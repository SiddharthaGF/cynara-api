name: Deploy production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-monsterasp-main
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.ref || github.event.workflow_run.head_branch }}
          repository: ${{ github.event_name == 'workflow_dispatch' && github.repository || github.event.workflow_run.repository.full_name }}
          fetch-depth: 1

      - name: Setup .NET and restore
        uses: ./.github/actions/setup-dotnet-and-restore

      - name: Publish
        run: dotnet publish src/Cynara.Api/Cynara.Api.csproj --configuration Release --output ./publish --runtime win-x86 --self-contained false

      - name: Deploy via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'
