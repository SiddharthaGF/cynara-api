name: Pipeline

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

jobs:
  check:
    name: Format, lint, and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET and restore
        uses: ./.github/actions/setup-dotnet-and-restore

      - name: Check (format + lint + test)
        run: make check

  deploy-preview:
    name: Build and deploy preview
    needs: [check]
    if: ${{ needs.check.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
    runs-on: windows-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET, restore and publish
        uses: ./.github/actions/setup-and-publish

      - name: Render production appsettings and web.config with DB connection string
        shell: bash
        env:
          DB_CONNECTION_STRING: ${{ secrets.PREVIEW_DB_CONNECTION_STRING }}
        run: |
          mkdir -p ./publish
          python - <<'PY'
          import json, os, pathlib
          from xml.etree import ElementTree as ET

          cs = os.environ["DB_CONNECTION_STRING"]

          cfg = {
            "Database": {"Provider": "SqlServer"},
            "ConnectionStrings": {"Default": cs},
          }
          pathlib.Path("./publish/appsettings.Production.json").write_text(
            json.dumps(cfg, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Wrote appsettings.Production.json ({len(json.dumps(cfg))} bytes)")

          webconfig = pathlib.Path("./publish/web.config")
          if webconfig.exists():
            xml_text = webconfig.read_text(encoding="utf-8")
          else:
            xml_text = (
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
              "<configuration>\n"
              "  <location path=\".\" inheritInChildApplications=\"false\">\n"
              "    <system.webServer>\n"
              "      <handlers>\n"
              "        <add name=\"aspNetCore\" path=\"*\" verb=\"*\" modules=\"AspNetCoreModuleV2\" resourceType=\"Unspecified\" />\n"
              "      </handlers>\n"
              "      <aspNetCore processPath=\".\\Cynara.Api.exe\" arguments=\"\" stdoutLogEnabled=\"true\" stdoutLogFile=\".\\Logs\\stdout\" hostingModel=\"InProcess\" />\n"
              "    </system.webServer>\n"
              "  </location>\n"
              "</configuration>\n"
            )

          ET.register_namespace("", "")
          root = ET.fromstring(xml_text)
          aspnetcore = root.find(".//{*}aspNetCore")
          if aspnetcore is None:
            raise SystemExit("aspNetCore element not found in web.config")

          for child in list(aspnetcore):
            if child.tag.endswith("}environmentVariables") or child.tag == "environmentVariables":
              aspnetcore.remove(child)
              break

          env_vars = ET.SubElement(aspnetcore, "environmentVariables")
          ET.SubElement(env_vars, "environmentVariable", {
            "name": "ASPNETCORE_ENVIRONMENT", "value": "Production",
          })
          ET.SubElement(env_vars, "environmentVariable", {
            "name": "ConnectionStrings__Default", "value": cs,
          })

          out_path = pathlib.Path("./publish/web.config")
          ET.indent(root, space="  ")
          out_path.write_bytes(
            b'<?xml version="1.0" encoding="utf-8"?>\n'
            + ET.tostring(root, encoding="utf-8", xml_declaration=False)
          )
          print(f"Wrote web.config ({out_path.stat().st_size} bytes)")
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cynara-api-preview
          path: ./publish/**
          if-no-files-found: error
          retention-days: 7

      - name: Deploy preview via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.PREVIEW_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.PREVIEW_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.PREVIEW_SERVER_USERNAME }}
          server-password: ${{ secrets.PREVIEW_SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'

  deploy-production:
    name: Build and deploy production
    needs: [check]
    if: ${{ needs.check.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET, restore and publish
        uses: ./.github/actions/setup-and-publish

      - name: Render production appsettings and web.config with DB connection string
        shell: bash
        env:
          DB_CONNECTION_STRING: ${{ secrets.PROD_DB_CONNECTION_STRING }}
        run: |
          mkdir -p ./publish
          python - <<'PY'
          import json, os, pathlib
          from xml.etree import ElementTree as ET

          cs = os.environ["DB_CONNECTION_STRING"]

          cfg = {
            "Database": {"Provider": "SqlServer"},
            "ConnectionStrings": {"Default": cs},
          }
          pathlib.Path("./publish/appsettings.Production.json").write_text(
            json.dumps(cfg, indent=2) + "\n", encoding="utf-8"
          )
          print(f"Wrote appsettings.Production.json ({len(json.dumps(cfg))} bytes)")

          webconfig = pathlib.Path("./publish/web.config")
          if webconfig.exists():
            xml_text = webconfig.read_text(encoding="utf-8")
          else:
            xml_text = (
              "<?xml version=\"1.0\" encoding=\"utf-8\"?>\n"
              "<configuration>\n"
              "  <location path=\".\" inheritInChildApplications=\"false\">\n"
              "    <system.webServer>\n"
              "      <handlers>\n"
              "        <add name=\"aspNetCore\" path=\"*\" verb=\"*\" modules=\"AspNetCoreModuleV2\" resourceType=\"Unspecified\" />\n"
              "      </handlers>\n"
              "      <aspNetCore processPath=\".\\Cynara.Api.exe\" arguments=\"\" stdoutLogEnabled=\"true\" stdoutLogFile=\".\\Logs\\stdout\" hostingModel=\"InProcess\" />\n"
              "    </system.webServer>\n"
              "  </location>\n"
              "</configuration>\n"
            )

          ET.register_namespace("", "")
          root = ET.fromstring(xml_text)
          aspnetcore = root.find(".//{*}aspNetCore")
          if aspnetcore is None:
            raise SystemExit("aspNetCore element not found in web.config")

          for child in list(aspnetcore):
            if child.tag.endswith("}environmentVariables") or child.tag == "environmentVariables":
              aspnetcore.remove(child)
              break

          env_vars = ET.SubElement(aspnetcore, "environmentVariables")
          ET.SubElement(env_vars, "environmentVariable", {
            "name": "ASPNETCORE_ENVIRONMENT", "value": "Production",
          })
          ET.SubElement(env_vars, "environmentVariable", {
            "name": "ConnectionStrings__Default", "value": cs,
          })

          out_path = pathlib.Path("./publish/web.config")
          ET.indent(root, space="  ")
          out_path.write_bytes(
            b'<?xml version="1.0" encoding="utf-8"?>\n'
            + ET.tostring(root, encoding="utf-8", xml_declaration=False)
          )
          print(f"Wrote web.config ({out_path.stat().st_size} bytes)")
          PY

      - name: Deploy production via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'
