name: Pipeline

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  DOTNET_CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PUBLISH_ARTIFACT: cynara-api-publish

jobs:
  check:
    name: Format, lint, test, and publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to publish
        id: meta
        shell: bash
        run: |
          publish=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            publish=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref }}" = "refs/heads/develop" ] || \
               [ "${{ github.ref }}" = "refs/heads/main" ]; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Setup .NET and restore
        uses: ./.github/actions/setup-dotnet-and-restore

      - name: Format check
        run: make fmt:check

      - name: Lint
        run: make lint CONFIGURATION=${{ env.DOTNET_CONFIGURATION }}

      - name: Test
        run: >
          dotnet test Cynara.Api.sln
          --no-restore
          -c ${{ env.DOTNET_CONFIGURATION }}
          --verbosity normal
          --logger "console;verbosity=normal"
          --filter "Category!=MsSql"

      - name: Publish win-x86
        if: steps.meta.outputs.publish == 'true'
        uses: ./.github/actions/publish-api
        with:
          configuration: ${{ env.DOTNET_CONFIGURATION }}

      - name: Upload publish artifact
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PUBLISH_ARTIFACT }}
          path: ./publish/**
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: Deploy preview
    needs: [check]
    if: >-
      needs.check.outputs.publish == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PUBLISH_ARTIFACT }}
          path: ./publish

      - name: Render preview appsettings and web.config
        uses: ./.github/actions/render-publish-config
        with:
          db-connection-string: ${{ secrets.PREVIEW_DB_CONNECTION_STRING }}
          aspnetcore-environment: Development

      - name: Drop and recreate preview database
        shell: bash
        env:
          DB_CONNECTION_STRING: ${{ secrets.PREVIEW_DB_CONNECTION_STRING }}
          ADMIN_DB_CONNECTION_STRING: ${{ secrets.PREVIEW_ADMIN_DB_CONNECTION_STRING }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_NAME" != "develop" ]; then
            echo "Skipping DB reset (event=$GITHUB_EVENT_NAME ref=$GITHUB_REF_NAME)"
            exit 0
          fi
          if [ -z "${DB_CONNECTION_STRING:-}" ] || [ -z "${ADMIN_DB_CONNECTION_STRING:-}" ]; then
            echo "DB_CONNECTION_STRING or ADMIN_DB_CONNECTION_STRING not set; skipping DB reset."
            exit 0
          fi
          TARGET_DB=$(printf '%s' "$DB_CONNECTION_STRING" | sed -nE 's/.*(Initial Catalog|Database)=([^;]+).*/\2/Ip' | tr -d ' ')
          if [ -z "$TARGET_DB" ]; then
            echo "Could not extract Initial Catalog from DB_CONNECTION_STRING"
            exit 1
          fi
          echo "Reset target database: $TARGET_DB"
          python - <<PY
          import os
          import pyodbc
          target = os.environ["TARGET_DB"]
          cs = os.environ["ADMIN_DB_CONNECTION_STRING"]
          parts = [p for p in cs.split(";") if p.strip()]
          cleaned = []
          for p in parts:
              key = p.split("=", 1)[0].strip().lower()
              if key in ("initial catalog", "database"):
                  continue
              cleaned.append(p)
          admin = ";".join(cleaned)
          conn = pyodbc.connect(admin, autocommit=True, timeout=30)
          cur = conn.cursor()
          try:
              cur.execute(f"IF DB_ID(?) IS NOT NULL BEGIN ALTER DATABASE [{target}] SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE [{target}]; END", target)
          except Exception as exc:
              print(f"Drop ignored: {exc}")
          cur.execute(f"CREATE DATABASE [{target}]")
          print(f"Recreated database '{target}'")
          conn.close()
          PY

      - name: Deploy preview via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.PREVIEW_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.PREVIEW_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.PREVIEW_SERVER_USERNAME }}
          server-password: ${{ secrets.PREVIEW_SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'

  deploy-production:
    name: Deploy production
    needs: [check]
    if: >-
      needs.check.outputs.publish == 'true'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PUBLISH_ARTIFACT }}
          path: ./publish

      - name: Render production appsettings and web.config
        uses: ./.github/actions/render-publish-config
        with:
          db-connection-string: ${{ secrets.PROD_DB_CONNECTION_STRING }}

      - name: Deploy production via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'
