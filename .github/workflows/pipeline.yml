name: Pipeline

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  DOTNET_CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PUBLISH_ARTIFACT: cynara-api-publish

jobs:
  check:
    name: Format, lint, test, and publish
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Decide whether to publish
        id: meta
        shell: bash
        run: |
          publish=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            publish=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref }}" = "refs/heads/develop" ] || \
               [ "${{ github.ref }}" = "refs/heads/main" ]; then
              publish=true
            fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Setup .NET and restore
        uses: ./.github/actions/setup-dotnet-and-restore

      - name: Format check
        run: make fmt:check

      - name: Lint
        run: make lint CONFIGURATION=${{ env.DOTNET_CONFIGURATION }}

      - name: Test
        run: >
          dotnet test Cynara.Api.sln
          --no-restore
          -c ${{ env.DOTNET_CONFIGURATION }}
          --verbosity normal
          --logger "console;verbosity=normal"
          --filter "Category!=MsSql"

      - name: Publish win-x86
        if: steps.meta.outputs.publish == 'true'
        uses: ./.github/actions/publish-api
        with:
          configuration: ${{ env.DOTNET_CONFIGURATION }}

      - name: Upload publish artifact
        if: steps.meta.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PUBLISH_ARTIFACT }}
          path: ./publish/**
          if-no-files-found: error
          retention-days: 7

  deploy-preview:
    name: Deploy preview
    needs: [check]
    if: >-
      needs.check.outputs.publish == 'true'
      && github.event_name == 'push'
      && github.ref == 'refs/heads/develop'
    runs-on: windows-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PUBLISH_ARTIFACT }}
          path: ./publish

      - name: Render preview appsettings and web.config
        uses: ./.github/actions/render-publish-config
        with:
          db-connection-string: ${{ secrets.PREVIEW_DB_CONNECTION_STRING }}
          aspnetcore-environment: Development

      - name: Drop and recreate preview database
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        shell: pwsh
        env:
          DB_CONNECTION_STRING: ${{ secrets.PREVIEW_DB_CONNECTION_STRING }}
          ADMIN_DB_CONNECTION_STRING: ${{ secrets.PREVIEW_ADMIN_DB_CONNECTION_STRING }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:DB_CONNECTION_STRING -or -not $env:ADMIN_DB_CONNECTION_STRING) {
            Write-Host "DB_CONNECTION_STRING or ADMIN_DB_CONNECTION_STRING not set; skipping DB reset."
            exit 0
          }
          $builder = New-Object System.Data.Common.DbConnectionStringBuilder
          $builder.ConnectionString = $env:DB_CONNECTION_STRING
          $targetDb = $builder['Initial Catalog']
          if (-not $targetDb) { throw "Initial Catalog missing from DB_CONNECTION_STRING" }
          $adminBuilder = New-Object System.Data.Common.DbConnectionStringBuilder
          $adminBuilder.ConnectionString = $env:ADMIN_DB_CONNECTION_STRING
          if ($adminBuilder['Initial Catalog']) { $adminBuilder['Initial Catalog'] = 'master' }
          $conn = New-Object System.Data.SqlClient.SqlConnection($adminBuilder.ConnectionString)
          $conn.Open()
          try {
            $cmd = $conn.CreateCommand()
            $cmd.CommandTimeout = 60
            $cmd.CommandText = @"
          IF DB_ID('$targetDb') IS NOT NULL
          BEGIN
            ALTER DATABASE [$targetDb] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
            DROP DATABASE [$targetDb];
          END
"@
            $cmd.ExecuteNonQuery() | Out-Null
            Write-Host "Dropped database '$targetDb' (if it existed)."
            $cmd.CommandText = "CREATE DATABASE [$targetDb];"
            $cmd.ExecuteNonQuery() | Out-Null
            Write-Host "Created empty database '$targetDb'. The API will apply migrations on startup."
          }
          finally {
            $conn.Close()
          }

      - name: Deploy preview via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.PREVIEW_WEBSITE_NAME }}
          server-computer-name: ${{ secrets.PREVIEW_SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.PREVIEW_SERVER_USERNAME }}
          server-password: ${{ secrets.PREVIEW_SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'

  deploy-production:
    name: Deploy production
    needs: [check]
    if: >-
      needs.check.outputs.publish == 'true'
      && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || github.event_name == 'workflow_dispatch'
      )
    runs-on: windows-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PUBLISH_ARTIFACT }}
          path: ./publish

      - name: Render production appsettings and web.config
        uses: ./.github/actions/render-publish-config
        with:
          db-connection-string: ${{ secrets.PROD_DB_CONNECTION_STRING }}

      - name: Deploy production via WebDeploy
        uses: rasmusbuchholdt/simply-web-deploy@2.1.0
        with:
          website-name: ${{ secrets.WEBSITE_NAME }}
          server-computer-name: ${{ secrets.SERVER_COMPUTER_NAME }}
          server-username: ${{ secrets.SERVER_USERNAME }}
          server-password: ${{ secrets.SERVER_PASSWORD }}
          source-path: '\publish\'
          target-delete: 'true'
          skip-patterns: '.*\.db$,.*\.db-shm$,.*\.db-wal$'
