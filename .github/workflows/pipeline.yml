name: Pipeline

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  DOTNET_CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PUBLISH_ARTIFACT: cynara-api-publish

jobs:
  check:
    name: Format, lint, test, and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET and restore
        uses: ./.github/actions/setup-dotnet-and-restore

      - name: Format check
        run: make fmt:check

      - name: Lint
        run: make lint CONFIGURATION=${{ env.DOTNET_CONFIGURATION }}

      - name: Test
        run: >
          dotnet test Cynara.Api.sln
          --no-restore
          -c ${{ env.DOTNET_CONFIGURATION }}
          --verbosity normal
          --logger "console;verbosity=normal"
          --filter "Category!=E2E"

      - name: Publish win-x86
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/publish-api
        with:
          configuration: ${{ env.DOTNET_CONFIGURATION }}

      - name: Upload publish artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PUBLISH_ARTIFACT }}
          path: ./publish/**
          if-no-files-found: error
          retention-days: 7
