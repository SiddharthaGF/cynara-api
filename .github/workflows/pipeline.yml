name: Pipeline

on:
  pull_request:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: read

env:
  DOTNET_CONFIGURATION: Release
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET and restore
        uses: ./.github/actions/setup-dotnet-and-restore

      - name: Format check
        run: make fmt:check

      - name: Lint
        run: make lint CONFIGURATION=${{ env.DOTNET_CONFIGURATION }}

      - name: Test
        run: >
          dotnet test Cynara.Api.sln
          --no-restore
          -c ${{ env.DOTNET_CONFIGURATION }}
          --verbosity normal
          --logger "console;verbosity=normal"
          --filter "Category!=E2E"
