name: Setup .NET and restore
description: Set up .NET and restore the Cynara API solution. Callers must run actions/checkout first so the workspace is populated.

inputs:
  dotnet-version:
    description: .NET SDK version to install.
    required: false
    default: "9.0.x"
  solution:
    description: Path to the solution file to restore.
    required: false
    default: "Cynara.Api.sln"

runs:
  using: composite
  steps:
    - name: Setup .NET ${{ inputs.dotnet-version }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Restore ${{ inputs.solution }}
      shell: bash
      run: dotnet restore ${{ inputs.solution }}
