name: Apply EF Core migrations
description: |
  Apply pending EF Core migrations against a SQL Server database using
  `dotnet ef database update`. The startup project is bootstrapped with
  ASPNETCORE_ENVIRONMENT so it loads the right appsettings.{Environment}.json.
  Callers must run actions/checkout first so the workspace is populated.

inputs:
  db-connection-string:
    description: SQL Server connection string for the target database.
    required: true
  aspnetcore-environment:
    description: |
      ASPNETCORE_ENVIRONMENT value passed to the startup project so it picks
      the right appsettings.{Environment}.json.
    required: false
    default: "Production"
  project:
    description: Path to the EF Core project that owns the migrations.
    required: false
    default: "src/Cynara.Infrastructure"
  startup-project:
    description: Path to the project's startup host (for design-time host).
    required: false
    default: "src/Cynara.Api"

runs:
  using: composite
  steps:
    - name: Restore local .NET tools (dotnet-ef)
      shell: bash
      run: dotnet tool restore

    - name: Apply pending migrations
      shell: bash
      env:
        ASPNETCORE_ENVIRONMENT: ${{ inputs.aspnetcore-environment }}
        DB_CONNECTION_STRING: ${{ inputs.db-connection-string }}
      run: |
        dotnet ef database update \
          --project "${{ inputs.project }}" \
          --startup-project "${{ inputs.startup-project }}" \
          --connection "$DB_CONNECTION_STRING"
