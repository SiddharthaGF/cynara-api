name: Publish Cynara API
description: |
  Publish the API for IIS (win-x86, framework-dependent). Callers must
  checkout and set up .NET first. Restores the project for win-x86, then
  publishes.

inputs:
  project:
    description: Project to publish.
    required: false
    default: "src/Cynara.Api/Cynara.Api.csproj"
  configuration:
    description: Build configuration.
    required: false
    default: "Release"
  output:
    description: Publish output directory.
    required: false
    default: "./publish"
  no-build:
    description: Pass --no-build (project must already be built for win-x86).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore ${{ inputs.project }} for win-x86
      shell: bash
      run: >
        dotnet restore "${{ inputs.project }}"
        --runtime win-x86

    - name: Publish ${{ inputs.project }}
      shell: bash
      run: |
        args=(
          dotnet publish "${{ inputs.project }}"
          --configuration "${{ inputs.configuration }}"
          --output "${{ inputs.output }}"
          --runtime win-x86
          --self-contained false
          --no-restore
        )
        if [ "${{ inputs.no-build }}" = "true" ]; then
          args+=(--no-build)
        fi
        "${args[@]}"
